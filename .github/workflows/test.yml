name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts skips Electron's binary download: the tests exercise
      # the protocol, the identity store and a real signaling server, none of
      # which need the packaged agent.
      - run: npm ci --ignore-scripts
      - run: npm test
