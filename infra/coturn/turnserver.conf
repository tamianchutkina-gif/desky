# Desky relay.
#
# Only used when the two peers cannot reach each other directly, which
# is roughly one connection in five — symmetric NAT, restrictive
# corporate firewalls, some mobile networks. Direct paths are always
# preferred because they are faster and cost no bandwidth here.

listening-port=3478
tls-listening-port=5349

# Credentials are minted per session by the signaling server as an HMAC
# over an expiry timestamp, so nothing long-lived is ever handed to a
# browser. --static-auth-secret is supplied on the command line.
use-auth-secret

fingerprint

# Relayed media needs a wide UDP range; open these on the VPS firewall.
#
# Deliberately below 32768, which is where Linux's default ephemeral
# range starts. coturn runs with host networking, so a range inside the
# ephemeral one competes for ports with every outbound connection the
# machine makes — and the symptom is not a clear failure but a relay
# that works until it intermittently does not.
#
# 200 ports rather than 40. A relayed session takes roughly four to
# eight, so the old range ran out at about five simultaneous relayed
# sessions, well before the quotas below ever came into play.
min-port=24000
max-port=24200

no-cli
no-multicast-peers

# A TURN server that will relay to private ranges is an open proxy into
# whatever network it sits in. These denials are not optional.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Generous, because a support session is allowed to last all day.
# These bound how many allocations a client may hold at once and how
# many exist in total. They are not a limit on how long a session runs.
user-quota=12
total-quota=1200

# Nothing here caps session length, and nothing should.
#
# coturn's default allocation lifetime is one hour, which looks alarming
# in a product whose whole point is unlimited sessions — but a TURN
# allocation is not a session. WebRTC refreshes its allocation well
# before expiry for as long as the connection lives, so an eight-hour
# session simply refreshes eight times. Raising this would not extend
# any session; it would only delay reclaiming abandoned allocations.

no-tlsv1
no-tlsv1_1

# Logs go to the container's stdout, where `docker compose logs`
# finds them. `syslog` would hand them to a daemon that does not
# exist in this image, and they would simply vanish.
log-file=stdout
